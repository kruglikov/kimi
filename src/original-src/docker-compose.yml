name: kimi-plus-original

services:
  db:
    image: mariadb:10.5
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kimi_et
      MYSQL_USER: sql_kimi_et
      MYSQL_PASSWORD: NS889Hs4bhL1aub7HyEH6AjdYpYAlx
    volumes:
      - db_data:/var/lib/mysql
      - db_socket:/var/run/mysqld
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./docker/php
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web/htdocs:/var/www/html
      - ./tests:/opt/tests2
      - ./web/htdocs/kimi_ET/kimibatch/files/vendor:/var/www/html/kimi_ET/kimibatch/vendor:ro
      - db_socket:/var/run/mysqld
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  db_socket:
